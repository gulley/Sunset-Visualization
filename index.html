<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunset Times</title>
  <meta name="description" content="Sunset times for the next two weeks, and a countdown to the earliest sunset of the year.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">

  <link rel="stylesheet" href="styles.css">

  <!-- SunCalc library (provides the SunCalc global used by calc.js) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.8.0/suncalc.min.js"></script>
  <script type="module" src="main.js"></script>
</head>

<body>
  <header class="app-header">
    <h1 class="app-title">Sunset Times</h1>
  </header>
  <main class="app-content">
    <article class="clock-card">
      <header class="card-title">
        <h2 class="card-title-text">Countdown to Crepusculus</h2>
      </header>
      <div class="card-body">
        <canvas id="clock" class="clock-canvas" width="400" height="400" role="img"
          aria-label="Clock showing today's sunset time, with lines for the next two weeks of sunsets"></canvas>
      </div>
      <section id="sunset-info" class="card-footer" aria-live="polite"></section>
    </article>
  </main>
</body>

</html>
