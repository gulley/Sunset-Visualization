<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunset Times</title>
  <meta name="description" content="Sunset times for the next two weeks, and a countdown to the earliest sunset of the year.">
  <meta name="color-scheme" content="light dark">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="styles.css">

  <!-- SunCalc library (provides the SunCalc global used by calc.js) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.8.0/suncalc.min.js"></script>
  <script type="module" src="main.js"></script>
</head>

<body>
  <div class="page">
    <header class="hero">
      <p class="eyebrow">Sunset Times</p>
      <h1>Countdown to Crepusculus</h1>
      <p class="hero-date" id="today-date"></p>
    </header>

    <main class="card">
      <div class="clock-wrap">
        <canvas id="clock" role="img"
          aria-label="Clock showing today's sunset time, with lines for the next two weeks of sunsets and the earliest sunset of the year"></canvas>
      </div>
      <section id="sunset-info" class="info" aria-live="polite"></section>
    </main>

    <footer class="page-footer" id="location"></footer>
  </div>
</body>

</html>
